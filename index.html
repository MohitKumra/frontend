<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f13" />
    <meta
      name="description"
      content="Finamite — Your personal productivity workspace. Tasks, habits, notes, focus timer, and analytics in one app."
    />
    <title>Finamite — Personal Management System</title>

    <!-- Inter font: loaded declaratively (with preconnect) instead of injected
         via JS. This lets the browser start fetching earlier and avoids a
         post-first-paint reflow / FOUT on the very first load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Apply the theme synchronously BEFORE the bundle runs so there is no
         flash of the wrong theme and we don't block React's first render on an
         async storage read. Mirrors platform/theme.ts (key 'theme-preference'). -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('theme-preference');
          var dark =
            pref === 'dark' ||
            ((!pref || pref === 'system') &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
